---
# ── FastAPI API Deployment ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queryiq-api
  namespace: queryiq
  labels:
    app: queryiq-api
    app.kubernetes.io/name: queryiq
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: queryiq-api
  template:
    metadata:
      labels:
        app: queryiq-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: ghcr.io/YOUR_GITHUB_USER/queryiq-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: queryiq-config
            - secretRef:
                name: queryiq-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: 8000
            failureThreshold: 10
            periodSeconds: 5

---
# ── API Service ──
apiVersion: v1
kind: Service
metadata:
  name: queryiq-api-service
  namespace: queryiq
  labels:
    app: queryiq-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: queryiq-api
