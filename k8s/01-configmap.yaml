apiVersion: v1
kind: ConfigMap
metadata:
  name: queryiq-config
  namespace: queryiq
  labels:
    app.kubernetes.io/name: queryiq
data:
  REDIS_URL: "redis://redis-service:6379/0"
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/1"
  ASYNC_PIPELINE: "true"
  ENVIRONMENT: "production"
