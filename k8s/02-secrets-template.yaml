# ═══════════════════════════════════════════════════════════════
# TEMPLATE — Replace placeholders with your actual secrets
# Then apply:  kubectl apply -f 02-secrets.yaml
#
# To encode a value:  echo -n "YOUR_VALUE" | base64
# ═══════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: queryiq-secrets
  namespace: queryiq
  labels:
    app.kubernetes.io/name: queryiq
type: Opaque
data:
  # Base64-encoded values — replace with your actual keys
  GROQ_API_KEY: "REPLACE_WITH_BASE64_ENCODED_KEY"
  TAVILY_API_KEY: "REPLACE_WITH_BASE64_ENCODED_KEY"
  SUPABASE_URL: "REPLACE_WITH_BASE64_ENCODED_URL"
  SUPABASE_KEY: "REPLACE_WITH_BASE64_ENCODED_KEY"
  SENTRY_DSN: ""  # Optional — leave empty if not using Sentry
