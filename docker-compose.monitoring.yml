# ═══════════════════════════════════════════════════════════════
# Docker Compose Override — Monitoring Stack
# Usage: docker-compose -f docker-compose.yml -f docker-compose.monitoring.yml up
# ═══════════════════════════════════════════════════════════════

services:
  # ── Prometheus ──
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: queryiq-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - queryiq-net

  # ── Grafana ──
  grafana:
    image: grafana/grafana:10.4.0
    container_name: queryiq-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=queryiq
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - queryiq-net

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
