# ═══════════════════════════════════════════════════════════════
# QueryIQ CI/CD Pipeline
# Triggers on push to main branch
# Jobs: test → build-and-push → deploy
# ═══════════════════════════════════════════════════════════════

name: QueryIQ CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/queryiq-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/queryiq-frontend

jobs:
  # ── Job 1: Test ──
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: ./backend
        env:
          GROQ_API_KEY: "test-key"
          TAVILY_API_KEY: "test-key"
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_KEY: "test-key"
          REDIS_URL: "redis://localhost:6379/0"
          ASYNC_PIPELINE: "false"
        run: |
          pytest tests/ -v --tb=short || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: "http://localhost:8000"
        run: npm run build

  # ── Job 2: Build & Push Docker Images ──
  build-and-push:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.PRODUCTION_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to k3s ──
  deploy:
    name: Deploy to k3s
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Update image tags in manifests
        run: |
          sed -i "s|ghcr.io/YOUR_GITHUB_USER/queryiq-api:latest|${{ env.API_IMAGE }}:${{ github.sha }}|g" k8s/20-api.yaml
          sed -i "s|ghcr.io/YOUR_GITHUB_USER/queryiq-api:latest|${{ env.API_IMAGE }}:${{ github.sha }}|g" k8s/30-worker.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-configmap.yaml
          kubectl apply -f k8s/10-redis.yaml
          kubectl apply -f k8s/20-api.yaml
          kubectl apply -f k8s/30-worker.yaml
          kubectl apply -f k8s/40-ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl -n queryiq rollout status deployment/queryiq-api --timeout=120s
          kubectl -n queryiq rollout status deployment/queryiq-worker --timeout=120s

      - name: Verify deployment
        run: |
          kubectl -n queryiq get pods
          kubectl -n queryiq get services
