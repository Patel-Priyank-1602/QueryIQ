# Prometheus Configuration for QueryIQ
# Scrapes FastAPI /metrics endpoint

global:
  scrape_interval: 30s
  scrape_timeout: 25s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "queryiq-api-local"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "queryiq-api"
          environment: "local"

  - job_name: "queryiq-production-cloud"
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets: ["pqueryiq-api.onrender.com:443"]
        labels:
          service: "queryiq-api"
          environment: "production-cloud"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
